name: Parser fuzz

# A longer run of the parser tests with many random seeds. Weekly, and on demand from the Actions tab.
# It does not touch releases: when it finds a crash, open an issue and fix it like any other bug.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      iterations:
        description: "damaged copies of every NAL unit, per seed"
        default: "3000"

permissions:
  contents: read

jobs:
  fuzz:
    name: Damaged parameter sets and slices (ASan and UBSan)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install the packages from packages.txt
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' packages.txt | xargs sudo apt-get install -y --no-install-recommends

      - name: Build with sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
          cmake --build build --target parse-test gen-h264

      - name: Run with 20 seeds, one slice and four slices per picture
        run: |
          ITER="${{ github.event.inputs.iterations || '3000' }}"
          ./build/gen-h264 test.h264 1
          ./build/gen-h264 test4.h264 4
          for seed in $(seq 1 20); do
            ./build/parse-test test.h264 "$ITER" "$seed" || { echo "failed with seed $seed (one slice)"; exit 1; }
            ./build/parse-test test4.h264 "$ITER" "$seed" || { echo "failed with seed $seed (four slices)"; exit 1; }
          done
